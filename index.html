<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#16233A" />
<title>Registro de Sistemas · CEEPLT/CPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233A;
    --muted: #5B6472;
    --paper: #EEF1F4;
    --surface: #FFFFFF;
    --hover: #F4F7F9;
    --line: #D9DEE3;
    --teal: #1F6F6B;
    --gold-bright: #E0B15C;
    --gold-deep: #8C6C24;
    --gold-mid: #B8903E;
    --font-display: 'Roboto Slab', Georgia, 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body, h1, h2, p { margin: 0; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  header.topo {
    background: var(--ink);
    color: #fff;
    padding: 48px 26px 34px;
    position: relative;
  }
  header.topo::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-mid), var(--teal));
  }
  .cabecalho-interno { max-width: 780px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subtitulo {
    font-size: 14px;
    color: rgba(255,255,255,0.68);
  }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 26px 26px 50px;
  }

  .barra {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  #busca {
    flex: 1;
    min-width: 200px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
  }
  #busca::placeholder { color: var(--muted); }
  .contagem {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .registro {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,30,45,0.04);
  }

  .linha {
    display: grid;
    grid-template-columns: 104px 1fr 88px;
    grid-template-areas: "protocolo conteudo selo";
    align-items: center;
    gap: 20px;
    padding: 22px 26px;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: background-color 0.15s ease;
  }
  .linha:last-child { border-bottom: none; }
  .linha:not(.pendente):hover,
  .linha:not(.pendente):focus-visible {
    background: var(--hover);
  }
  .linha.pendente { cursor: default; }

  .protocolo { grid-area: protocolo; font-family: var(--font-mono); display: flex; flex-direction: column; gap: 4px; }
  .protocolo .num { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .protocolo .cat { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }

  .conteudo { grid-area: conteudo; min-width: 0; }
  .conteudo h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .conteudo p { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .conteudo p.aviso { margin-top: 6px; font-size: 12px; font-style: italic; color: var(--gold-deep); }

  .selo {
    grid-area: selo;
    justify-self: end;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--muted);
    transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .linha:not(.pendente):hover .selo,
  .linha:not(.pendente):focus-visible .selo {
    border-style: solid;
    border-color: var(--ink);
    background: var(--ink);
    color: #fff;
    transform: rotate(-6deg);
  }
  .linha.pendente .selo { opacity: 0.55; }

  @media (prefers-reduced-motion: reduce) {
    .linha, .selo { transition: none !important; }
    .linha:hover .selo { transform: none; }
  }

  .vazio {
    padding: 52px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 4px 26px 40px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
  }
  footer code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  @media (max-width: 640px) {
    header.topo { padding: 36px 20px 28px; }
    h1 { font-size: 24px; }
    main { padding: 22px 18px 40px; }
    .linha {
      grid-template-columns: 1fr auto;
      grid-template-areas: "protocolo selo" "conteudo conteudo";
      padding: 18px 20px;
      gap: 8px 14px;
    }
    .protocolo { flex-direction: row; align-items: center; gap: 10px; }
    .selo { width: 46px; height: 46px; font-size: 9px; }
  }
</style>
</head>
<body>

<header class="topo">
  <div class="cabecalho-interno">
    <div class="eyebrow">CEEPLT / CPM · Secretaria da Educação da Bahia</div>
    <h1>Registro de Sistemas</h1>
    <p class="subtitulo">Acesso direto às ferramentas internas em operação</p>
  </div>
</header>

<main>
  <div class="barra">
    <input id="busca" type="text" placeholder="Buscar por nome ou área..." aria-label="Buscar sistema" />
    <span class="contagem" id="contagem"></span>
  </div>
  <div class="registro" id="registro"></div>
</main>

<footer>
  Para adicionar um sistema, edite o array <code>sistemas</code> no código-fonte deste arquivo.
</footer>

<script>
  // Edite esta lista para adicionar, remover ou corrigir sistemas.
  // Uma URL contendo "SUBSTITUA" é tratada como pendente e fica inativa até ser corrigida.
  const sistemas = [
    {
      numero: 1,
      sigla: "SCA",
      nome: "Sistema de Controle de Atendimento",
      descricao: "Fila e atendimento da CPM, com sincronização em tempo real via Firebase.",
      categoria: "Atendimento",
      url: "https://scacpm.vercel.app"
    },
    {
      numero: 2,
      sigla: "SEI",
      nome: "Painel de Processos SEI",
      descricao: "Busca avançada, dashboards e dados de equipe complementares ao SEI.",
      categoria: "Processos",
      url: "https://SUBSTITUA-URL-DO-SEI.vercel.app"
    },
    {
      numero: 3,
      sigla: "SCC",
      nome: "Sistema de Controle de Convocação",
      descricao: "Candidatos convocados, checklist de documentos e lotes de convocação.",
      categoria: "Convocação",
      url: "https://SUBSTITUA-URL-DO-SCC.vercel.app"
    },
    {
      numero: 4,
      sigla: "FAC",
      nome: "Sistema de Facilitação",
      descricao: "Carências e vacâncias de pessoal da região NTE 26.",
      categoria: "Pessoal",
      url: "https://SUBSTITUA-URL-DA-FACILITACAO.vercel.app"
    },
    {
      numero: 5,
      sigla: "SAGP",
      nome: "Sistema de Acompanhamento e Gestão de Profissionais",
      descricao: "Situação funcional, contatos e decisões (desligamento, bloqueio, remoção, relotação) de profissionais sem lotação ativa.",
      categoria: "Acompanhamento",
      url: "https://sagp.vercel.app"
    }
  ];

  const ano = new Date().getFullYear();
  const container = document.getElementById('registro');
  const contagem = document.getElementById('contagem');
  const busca = document.getElementById('busca');

  function formatarNumero(n) {
    return 'Nº ' + String(n).padStart(3, '0') + '/' + ano;
  }

  function criarLinha(s) {
    const pendente = s.url.includes('SUBSTITUA');
    const el = document.createElement(pendente ? 'div' : 'a');
    el.className = 'linha' + (pendente ? ' pendente' : '');
    if (!pendente) {
      el.href = s.url;
      el.target = '_blank';
      el.rel = 'noopener';
    }
    el.innerHTML =
      '<div class="protocolo">' +
        '<span class="num">' + (pendente ? 'S/ Nº' : formatarNumero(s.numero)) + '</span>' +
        '<span class="cat">' + s.categoria + '</span>' +
      '</div>' +
      '<div class="conteudo">' +
        '<h2>' + s.nome + '</h2>' +
        '<p>' + s.descricao + '</p>' +
        (pendente ? '<p class="aviso">Aguardando link — adicione a URL no array "sistemas".</p>' : '') +
      '</div>' +
      '<div class="selo">' + (pendente ? '—' : 'ABRIR') + '</div>';
    return el;
  }

  function renderizar(lista) {
    container.innerHTML = '';
    if (lista.length === 0) {
      const vazio = document.createElement('div');
      vazio.className = 'vazio';
      vazio.textContent = 'Nenhum sistema encontrado para esse termo.';
      container.appendChild(vazio);
    } else {
      lista.forEach(function (s) { container.appendChild(criarLinha(s)); });
    }
    contagem.textContent = lista.length + ' de ' + sistemas.length + ' sistemas';
  }

  busca.addEventListener('input', function () {
    const termo = busca.value.trim().toLowerCase();
    const filtrado = sistemas.filter(function (s) {
      return (s.nome + ' ' + s.descricao + ' ' + s.categoria + ' ' + s.sigla).toLowerCase().includes(termo);
    });
    renderizar(filtrado);
  });

  renderizar(sistemas);
</script>

</body>
</html>
