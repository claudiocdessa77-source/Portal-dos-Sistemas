<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#16233A" />
<title>Registro de Sistemas · CEEPLT/CPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233A;
    --muted: #5B6472;
    --paper: #EEF1F4;
    --surface: #FFFFFF;
    --hover: #F4F7F9;
    --line: #D9DEE3;
    --teal: #1F6F6B;
    --gold-bright: #E0B15C;
    --gold-deep: #8C6C24;
    --gold-mid: #B8903E;
    --font-display: 'Roboto Slab', Georgia, 'Times New Roman', serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body, h1, h2, p { margin: 0; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  header.topo {
    background: var(--ink);
    color: #fff;
    padding: 48px 26px 34px;
    position: relative;
  }
  header.topo::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-mid), var(--teal));
  }
  .cabecalho-interno { max-width: 780px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subtitulo {
    font-size: 14px;
    color: rgba(255,255,255,0.68);
  }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 26px 26px 50px;
  }

  .barra {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  #busca {
    flex: 1;
    min-width: 200px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
  }
  #busca::placeholder { color: var(--muted); }
  .contagem {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .btn-novo {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-novo:hover { background: #223454; }

  .form-novo {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 18px;
    display: grid;
    gap: 14px;
  }
  .campo label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
  }
  .campo-inline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-acoes {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-primario, .btn-secundario {
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .btn-primario {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primario:hover { background: #223454; }
  .btn-primario:disabled { opacity: 0.6; cursor: default; }
  .btn-secundario { background: var(--surface); color: var(--muted); }
  .form-erro { font-size: 12.5px; color: #A13D2B; margin: 0; }

  .registro {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,30,45,0.04);
  }

  .linha {
    display: grid;
    grid-template-columns: 104px 1fr 88px;
    grid-template-areas: "protocolo conteudo selo";
    align-items: center;
    gap: 20px;
    padding: 22px 26px;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: background-color 0.15s ease;
  }
  .linha:last-child { border-bottom: none; }
  .linha:hover,
  .linha:focus-visible {
    background: var(--hover);
  }

  .protocolo { grid-area: protocolo; font-family: var(--font-mono); display: flex; flex-direction: column; gap: 4px; }
  .protocolo .num { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .protocolo .cat { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }

  .conteudo { grid-area: conteudo; min-width: 0; }
  .conteudo h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .conteudo p { font-size: 13.5px; line-height: 1.5; color: var(--muted); }

  .selo {
    grid-area: selo;
    justify-self: end;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--muted);
    transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .linha:hover .selo,
  .linha:focus-visible .selo {
    border-style: solid;
    border-color: var(--ink);
    background: var(--ink);
    color: #fff;
    transform: rotate(-6deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .linha, .selo { transition: none !important; }
    .linha:hover .selo { transform: none; }
  }

  .vazio {
    padding: 52px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 4px 26px 40px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
  }
  footer code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }

  @media (max-width: 640px) {
    header.topo { padding: 36px 20px 28px; }
    h1 { font-size: 24px; }
    main { padding: 22px 18px 40px; }
    .linha {
      grid-template-columns: 1fr auto;
      grid-template-areas: "protocolo selo" "conteudo conteudo";
      padding: 18px 20px;
      gap: 8px 14px;
    }
    .protocolo { flex-direction: row; align-items: center; gap: 10px; }
    .selo { width: 46px; height: 46px; font-size: 9px; }
    .barra { align-items: stretch; }
    .btn-novo { width: 100%; }
    .campo-inline { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topo">
  <div class="cabecalho-interno">
    <div class="eyebrow">CEEPLT / CPM · Secretaria da Educação da Bahia</div>
    <h1>Registro de Sistemas</h1>
    <p class="subtitulo">Acesso direto às ferramentas internas em operação</p>
  </div>
</header>

<main>
  <div class="barra">
    <input id="busca" type="text" placeholder="Buscar por nome ou área..." aria-label="Buscar sistema" />
    <button type="button" id="btnNovo" class="btn-novo">+ Novo sistema</button>
    <span class="contagem" id="contagem"></span>
  </div>

  <form id="formNovo" class="form-novo" hidden>
    <div class="campo">
      <label for="fNome">Nome do sistema</label>
      <input id="fNome" required />
    </div>
    <div class="campo">
      <label for="fDescricao">Descrição</label>
      <input id="fDescricao" required />
    </div>
    <div class="campo-inline">
      <div class="campo">
        <label for="fCategoria">Categoria</label>
        <input id="fCategoria" required />
      </div>
      <div class="campo">
        <label for="fUrl">URL</label>
        <input id="fUrl" type="url" required placeholder="https://..." />
      </div>
    </div>
    <p id="formErro" class="form-erro" hidden></p>
    <div class="form-acoes">
      <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
      <button type="submit" class="btn-primario">Salvar sistema</button>
    </div>
  </form>

  <div class="registro" id="registro"></div>
</main>

<footer>
  Use "+ Novo sistema" para adicionar ao registro — nenhuma edição neste arquivo é necessária.
</footer>

<script>
  // URL do Realtime Database (Firebase) que guarda o registro de sistemas.
  // Crie um projeto Firebase novo e dedicado a isso (Realtime Database) e cole a databaseURL abaixo.
  const REGISTRY_URL = 'https://meuportalcpm-default-rtdb.firebaseio.com';

  const container = document.getElementById('registro');
  const contagem = document.getElementById('contagem');
  const busca = document.getElementById('busca');
  let sistemas = [];

  function formatarNumero(n, anoRegistro) {
    return 'Nº ' + String(n).padStart(3, '0') + '/' + anoRegistro;
  }

  function criarLinha(s) {
    const el = document.createElement('a');
    el.className = 'linha';
    el.href = s.url;
    el.target = '_blank';
    el.rel = 'noopener';
    el.innerHTML =
      '<div class="protocolo">' +
        '<span class="num">' + formatarNumero(s._numero, s._ano) + '</span>' +
        '<span class="cat">' + (s.categoria || '') + '</span>' +
      '</div>' +
      '<div class="conteudo">' +
        '<h2>' + s.nome + '</h2>' +
        '<p>' + s.descricao + '</p>' +
      '</div>' +
      '<div class="selo">ABRIR</div>';
    return el;
  }

  function mostrarMensagem(html) {
    container.innerHTML = '<div class="vazio">' + html + '</div>';
  }

  function renderizar(lista, termo) {
    if (lista.length === 0) {
      mostrarMensagem(termo ? 'Nenhum sistema encontrado para esse termo.' : 'Nenhum sistema registrado ainda.');
    } else {
      container.innerHTML = '';
      lista.forEach(function (s) { container.appendChild(criarLinha(s)); });
    }
    contagem.textContent = lista.length + ' de ' + sistemas.length + ' sistemas';
  }

  function carregar() {
    mostrarMensagem('Carregando registro...');
    fetch(REGISTRY_URL + '/sistemas.json')
      .then(function (r) {
        if (!r.ok) throw new Error('Falha ao carregar');
        return r.json();
      })
      .then(function (dados) {
        const anoPadrao = String(new Date().getFullYear());
        const lista = Object.keys(dados || {}).map(function (chave) { return dados[chave]; });
        lista.sort(function (a, b) { return (a.criadoEm || '').localeCompare(b.criadoEm || ''); });
        lista.forEach(function (s, i) {
          s._numero = i + 1;
          s._ano = (s.criadoEm || '').slice(0, 4) || anoPadrao;
        });
        sistemas = lista;
        renderizar(sistemas);
      })
      .catch(function () {
        sistemas = [];
        mostrarMensagem('Não foi possível carregar o registro.<br><span style="opacity:.7">Confira a REGISTRY_URL no código-fonte.</span>');
        contagem.textContent = '';
      });
  }

  busca.addEventListener('input', function () {
    const termo = busca.value.trim().toLowerCase();
    const filtrado = sistemas.filter(function (s) {
      return (s.nome + ' ' + s.descricao + ' ' + (s.categoria || '')).toLowerCase().includes(termo);
    });
    renderizar(filtrado, termo);
  });

  const btnNovo = document.getElementById('btnNovo');
  const formNovo = document.getElementById('formNovo');
  const btnCancelar = document.getElementById('btnCancelar');
  const formErro = document.getElementById('formErro');

  btnNovo.addEventListener('click', function () {
    formNovo.hidden = !formNovo.hidden;
    if (!formNovo.hidden) document.getElementById('fNome').focus();
  });

  btnCancelar.addEventListener('click', function () {
    formNovo.reset();
    formNovo.hidden = true;
    formErro.hidden = true;
  });

  function gerarSlug(nome) {
    const base = nome
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
    return (base || 'sistema') + '-' + Date.now().toString(36);
  }

  formNovo.addEventListener('submit', function (e) {
    e.preventDefault();
    formErro.hidden = true;

    const nome = document.getElementById('fNome').value.trim();
    const descricao = document.getElementById('fDescricao').value.trim();
    const categoria = document.getElementById('fCategoria').value.trim();
    const url = document.getElementById('fUrl').value.trim();
    if (!nome || !descricao || !categoria || !url) return;

    const slug = gerarSlug(nome);
    const dados = { nome: nome, descricao: descricao, categoria: categoria, url: url, criadoEm: new Date().toISOString() };

    const btnSalvar = formNovo.querySelector('.btn-primario');
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';

    fetch(REGISTRY_URL + '/sistemas/' + slug + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    })
      .then(function (r) {
        if (!r.ok) throw new Error('Falha ao salvar');
        formNovo.reset();
        formNovo.hidden = true;
        carregar();
      })
      .catch(function () {
        formErro.textContent = 'Não foi possível salvar. Confira sua conexão e tente de novo.';
        formErro.hidden = false;
      })
      .finally(function () {
        btnSalvar.disabled = false;
        btnSalvar.textContent = 'Salvar sistema';
      });
  });

  carregar();
</script>

</body>
</html>
